<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <input id="scene" list="scenes" placeholder="Cảnh… (gõ để lọc)" spellcheck="false" />
      <datalist id="scenes"></datalist>
      <button id="reload" title="Nạp lại cảnh từ đĩa (R)">Nạp lại</button>
      <div class="seg" id="cam" title="Camera (C)">
        <button data-mode="scene" class="on">Camera cảnh</button>
        <button data-mode="free">Camera tự do</button>
      </div>
      <label title="Khử răng cưa: siêu mẫu càng cao càng nét, càng chậm">
        AA
        <select id="aa">
          <option value="off">tắt</option>
          <option value="ss1.5" selected>1.5×</option>
          <option value="ss2">2× (như render)</option>
        </select>
      </label>
      <label
        title="Lăn chuột / hai ngón trên touchpad ở camera tự do; Ctrl + lăn hay chụm hai ngón luôn là tiến lùi"
      >
        Lăn
        <select id="wheel">
          <option value="auto">tự nhận</option>
          <option value="zoom">tiến lùi</option>
          <option value="pan">dời</option>
        </select>
      </label>
      <span id="status"></span>
    </header>
    <div id="mid">
      <main id="view">
        <div id="frame"></div>
        <div id="msg"></div>
      </main>
      <aside id="side">
        <div class="sidehead">
          <button id="sideToggle" title="Gập / mở panel">⇆</button>
          <b>Bàn tay</b>
          <span id="handsAt" class="dim"></span>
        </div>
        <div class="sidebody">
          <div id="handList"></div>
          <section id="selBox" hidden>
            <div id="selName"></div>
            <div class="seg" id="angles" title="Camera tự do bay tới cận bàn tay"></div>
            <label><input type="checkbox" id="follow" checked /> Camera bám theo tay khi tua</label>
            <div id="measure"></div>
            <button id="editGrasp" title="Soạn kiểu cầm món × nhóm × biến thể này bằng mắt">
              Chỉnh kiểu cầm này
            </button>
          </section>
          <section id="editor" hidden></section>
        </div>
      </aside>
    </div>
    <footer>
      <button id="play" title="Phát / dừng (Space)">▶</button>
      <div id="track">
        <input id="time" type="range" min="0" max="1" step="0.001" value="0" />
        <div id="marks"></div>
      </div>
      <span id="clock">0.00 / 0.00 s</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
