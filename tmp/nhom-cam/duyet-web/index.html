<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt nhóm cầm — trước / sau</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --panel2: #252932; --line: #333845; --fg: #e6e8ee; --dim: #9aa1b2;
    --ok: #3fb27f; --sua: #e5534b; --hoi: #d9a53a; --acc: #6aa7ff; --truoc: #c9853d; --sau: #4fa3d9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 300px 1fr 360px; height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { background: var(--acc); border-color: var(--acc); color: #0b1220; font-weight: 600; }
  code { font: 12px ui-monospace, monospace; background: #0003; padding: 0 4px; border-radius: 4px; }
  textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--acc); }

  /* danh sách */
  #side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #side header { padding: 12px; border-bottom: 1px solid var(--line); }
  #side h1 { font-size: 15px; margin: 0 0 6px; }
  #prog { color: var(--dim); font-size: 12px; }
  #filters { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  #filters button { font-size: 12px; padding: 2px 8px; }
  #list { overflow-y: auto; overflow-x: hidden; flex: 1; padding: 4px 0 12px; }
  .sec { padding: 10px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .it { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent; }
  .it:hover { background: var(--panel2); }
  .it.cur { background: var(--panel2); border-left-color: var(--acc); }
  .it > div { min-width: 0; }
  .it .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .s { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .dot.ok { background: var(--ok); } .dot.sua { background: var(--sua); } .dot.hoi { background: var(--hoi); }
  .pen { font-size: 11px; color: var(--acc); }
  #keys { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 11px; color: var(--dim); }
  #keys kbd { font: 11px ui-monospace, monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

  /* ảnh */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #bar { display: flex; gap: 14px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .grp { display: flex; gap: 2px; align-items: center; }
  .grp > span { color: var(--dim); font-size: 12px; margin-right: 4px; }
  .grp button { border-radius: 0; } .grp button:first-of-type { border-radius: 6px 0 0 6px; } .grp button:last-of-type { border-radius: 0 6px 6px 0; }
  #frames { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  #frames button { position: relative; }
  #frames button.extra { opacity: .55; }
  #frames button.has::after { content: ''; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
  #stage { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 10px; align-items: center; justify-content: center; }
  .pane { position: relative; flex: 1; height: 100%; overflow: hidden; border-radius: 8px; background: #000; display: flex; align-items: center; justify-content: center; }
  .pane img { max-width: 100%; max-height: 100%; display: block; user-select: none; -webkit-user-drag: none; transition: transform .05s; }
  .tag { position: absolute; top: 8px; left: 8px; padding: 2px 10px; border-radius: 4px; font-weight: 700; font-size: 13px; color: #111; z-index: 3; pointer-events: none; }
  .tag.truoc { background: var(--truoc); } .tag.sau { background: var(--sau); } .tag.r { left: auto; right: 8px; }
  .wipe { position: relative; display: inline-block; max-width: 100%; max-height: 100%; }
  .wipe .top { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wipe .line { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 4px #000; z-index: 2; pointer-events: none; }
  .sheet { flex: 1; height: 100%; overflow: auto; text-align: center; }
  .sheet img { max-width: 100%; cursor: zoom-in; }
  .sheet.big img { max-width: none; cursor: zoom-out; }
  .empty { color: var(--dim); }
  .vbox { flex: 1; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .vids { flex: 1; min-height: 0; display: flex; gap: 8px; }
  .vids .pane video { max-width: 100%; max-height: 100%; display: block; }
  .vbox .under { text-align: center; }
  .vbox .under img { max-width: 100%; }
  #vtime { font: 12px ui-monospace, monospace; color: var(--dim); min-width: 150px; }

  /* nhận xét */
  #right { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  #right h2 { font-size: 16px; margin: 0; }
  .meta { font-size: 13px; color: var(--dim); }
  .meta b { color: var(--fg); font-weight: 600; }
  .lab { font: 11px ui-monospace, monospace; color: var(--dim); word-break: break-word; }
  .note { font-size: 13px; background: var(--panel2); border-radius: 6px; padding: 8px 10px; border-left: 3px solid var(--line); }
  .note.n-ro { border-left-color: var(--sua); } .note.n-it { border-left-color: var(--hoi); } .note.n-kh { border-left-color: var(--ok); }
  .box h3 { font-size: 12px; margin: 0 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  #status { display: flex; gap: 6px; }
  #status button { flex: 1; }
  #status button.on.ok { background: var(--ok); border-color: var(--ok); }
  #status button.on.sua { background: var(--sua); border-color: var(--sua); }
  #status button.on.hoi { background: var(--hoi); border-color: var(--hoi); }
  #saved { font-size: 12px; color: var(--dim); }
  #saved.err { color: var(--sua); }
  #others { font-size: 12px; color: var(--dim); }
  #others div { margin-top: 4px; }
  #others b { color: var(--fg); cursor: pointer; }
</style>
</head>
<body>
<aside id="side">
  <header>
    <h1>Duyệt nhóm cầm</h1>
    <div id="prog"></div>
    <div id="filters"></div>
  </header>
  <div id="list"></div>
  <div id="keys">
    <kbd>j</kbd>/<kbd>k</kbd> dòng · <kbd>←</kbd>/<kbd>→</kbd> giây · <kbd>a</kbd> góc ·
    <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> kiểu xem · <kbd>z</kbd> phóng ·
    giữ <kbd>Space</kbd> xem bản trước (kiểu Nháy) · <kbd>d</kbd> duyệt · <kbd>x</kbd> cần sửa · <kbd>q</kbd> hỏi lại ·
    <kbd>c</kbd> ghi khung · <kbd>Esc</kbd> thoát ô chữ ·
    video: <kbd>Space</kbd> chạy/dừng · <kbd>←</kbd>/<kbd>→</kbd> từng khung · <kbd>s</kbd> tốc độ
  </div>
</aside>

<main id="main">
  <div id="bar">
    <div class="grp" id="modes"><span>Xem</span></div>
    <div class="grp" id="angles"><span>Góc</span></div>
    <div class="grp" id="zooms"><span>Phóng</span></div>
    <label style="font-size:12px;color:var(--dim)"><input type="checkbox" id="extra"> hiện cả giây ngoài danh sách chọn</label>
    <label style="font-size:12px;color:var(--dim)"><input type="checkbox" id="auto"> tự nháy</label>
  </div>
  <div id="frames"></div>
  <div id="stage"></div>
</main>

<aside id="right"></aside>

<script>
const MODES = [['sbs', 'Cạnh nhau'], ['wipe', 'Trượt'], ['blink', 'Nháy']];
const ANGLES = [['cheo', 'chéo'], ['truoc', 'trước'], ['ngang', 'ngang']];
const ZOOMS = [1, 2, 3];
const STATUS = [['ok', 'Duyệt'], ['sua', 'Cần sửa'], ['hoi', 'Hỏi lại']];
const SECS = [['ro', 'Khác thấy rõ'], ['it', 'Khác ít'], ['kh', 'Gần như không khác'], ['g4', 'Tờ nhóm cầm G4']];
const FILTERS = [['all', 'Tất cả'], ['todo', 'Chưa quyết'], ['flag', 'Cần sửa / hỏi'], ['note', 'Có ghi chú']];
const LS = 'duyet-nhom-cam';

const S = { items: [], db: {}, cur: 0, frame: 0, mode: 'sbs', angle: null, zoom: 1, ox: 50, oy: 50, wipe: 50, flip: false, filter: 'all', extra: false, auto: null, speed: 1, still: false };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const url = (p) => '/' + p.split('/').map(encodeURIComponent).join('/');
const SPEEDS = [0.25, 0.5, 1];
const sec = (it) => it.kind === 'sheet' || it.kind === 'video' ? 'g4' : /^khác thấy rõ/i.test(it.verdict) ? 'ro' : /^gần như/i.test(it.verdict) ? 'kh' : 'it';
const fkey = (f) => `${f.t} s`;
const rec = (it) => (S.db[it.id] ??= { status: '', text: '', frames: {} });
const hasNote = (it) => { const c = S.db[it.id]; return !!c && (!!c.text || Object.values(c.frames || {}).some(Boolean)); };

function frames(it) {
  if (it.kind !== 'shot') return [];
  const c = S.db[it.id];
  return it.frames.filter((f) => S.extra || f.picked || c?.frames?.[fkey(f)]);
}

function order() {
  const out = [];
  for (const [k] of SECS) for (const it of S.items) if (sec(it) === k) out.push(it);
  return out;
}

function visible(it) {
  const c = S.db[it.id];
  if (S.filter === 'todo') return !c?.status;
  if (S.filter === 'flag') return c?.status === 'sua' || c?.status === 'hoi';
  if (S.filter === 'note') return hasNote(it);
  return true;
}

function renderList() {
  const list = $('#list');
  let html = '', last = '';
  for (const it of order()) {
    if (!visible(it) && it !== S.items[S.cur]) continue;
    const k = sec(it);
    if (k !== last) { html += `<div class="sec">${SECS.find((s) => s[0] === k)[1]}</div>`; last = k; }
    const c = S.db[it.id];
    const i = S.items.indexOf(it);
    const title = it.kind === 'shot' ? `#${it.n} ${it.scene.replace('t02-', '')}` : it.title;
    const sub = it.kind === 'shot' ? `${it.cast} · tay ${it.side} · ${it.item}@${it.group}` : it.kind === 'video' ? 'video' : 'tờ ghép';
    html += `<div class="it${i === S.cur ? ' cur' : ''}" data-i="${i}"><span class="dot ${c?.status || ''}"></span>
      <div><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div></div>${hasNote(it) ? '<span class="pen">✎</span>' : ''}</div>`;
  }
  list.innerHTML = html;
  list.querySelector('.cur')?.scrollIntoView({ block: 'nearest' });
  const done = S.items.filter((it) => S.db[it.id]?.status);
  const n = (s) => done.filter((it) => S.db[it.id].status === s).length;
  $('#prog').textContent = `Đã quyết ${done.length}/${S.items.length} · duyệt ${n('ok')} · cần sửa ${n('sua')} · hỏi lại ${n('hoi')}`;
  $('#filters').innerHTML = FILTERS.map(([k, l]) => `<button data-f="${k}" class="${S.filter === k ? 'on' : ''}">${l}</button>`).join('');
}

function renderBar() {
  const it = S.items[S.cur];
  const f = frames(it)[S.frame];
  const grp = (id, opts, cur, attr, ok = () => true) =>
    ($(id).innerHTML = $(id).firstElementChild.outerHTML + opts.map(([k, l]) => `<button data-${attr}="${k}" class="${cur == k ? 'on' : ''}" ${ok(k) ? '' : 'disabled style="opacity:.3"'}>${l}</button>`).join(''));
  const shot = it.kind === 'shot';
  grp('#modes', MODES, S.mode, 'mode', () => shot);
  grp('#angles', ANGLES, angleOf(f), 'angle', (k) => !!f?.views[k]);
  grp('#zooms', ZOOMS.map((z) => [z, z + '×']), S.zoom, 'zoom', () => shot);
  $('#extra').checked = S.extra;
  const c = S.db[it.id];
  if (it.kind === 'video') {
    $('#frames').innerHTML = `<button data-v="play">▶︎ / ❚❚</button><button data-v="-1">◀ khung</button><button data-v="1">khung ▶</button>
      <div class="grp"><span>Tốc độ</span>${SPEEDS.map((r) => `<button data-speed="${r}" class="${S.speed === r ? 'on' : ''}">${String(r).replace('.', ',')}×</button>`).join('')}</div>
      <span id="vtime"></span>${it.images?.length ? `<label style="font-size:12px;color:var(--dim)"><input type="checkbox" id="still" ${S.still ? 'checked' : ''}> hiện ảnh tĩnh</label>` : ''}`;
    $('#still')?.addEventListener('change', (e) => { S.still = e.target.checked; renderStage(); });
    return;
  }
  $('#frames').innerHTML = shot
    ? frames(it).map((f, i) => `<button data-fr="${i}" class="${i === S.frame ? 'on' : ''} ${f.picked ? '' : 'extra'} ${c?.frames?.[fkey(f)] ? 'has' : ''}">${f.t} s</button>`).join('') +
      (frames(it).length < it.frames.length ? `<span style="font-size:12px;color:var(--dim)">+${it.frames.length - frames(it).length} giây khác</span>` : '')
    : '<span class="empty">Tờ ghép sẵn — bấm ảnh để xem cỡ thật.</span>';
}

function angleOf(f) {
  if (!f) return null;
  return f.views[S.angle] ? S.angle : f.goc;
}

function img(src, extra = '') {
  const t = S.zoom > 1 ? `transform:scale(${S.zoom});transform-origin:${S.ox}% ${S.oy}%` : '';
  return `<img src="${url(src)}" style="${t}" ${extra} draggable="false">`;
}

function renderStage() {
  const it = S.items[S.cur];
  const st = $('#stage');
  if (it.kind === 'sheet') { st.innerHTML = `<div class="sheet"><img src="${url(it.src)}"></div>`; return; }
  if (it.kind === 'video') {
    st.innerHTML = `<div class="vbox"><div class="vids">${it.videos.map((v) => `<div class="pane">${v.label ? `<span class="tag sau">${esc(v.label)}</span>` : ''}
      <video src="${url(v.src)}" controls loop muted playsinline preload="auto"></video></div>`).join('')}</div>
      ${S.still && it.images?.length ? `<div class="under">${it.images.map((p) => `<img src="${url(p)}">`).join('')}</div>` : ''}</div>`;
    hookVideos(it);
    return;
  }
  const f = frames(it)[S.frame];
  if (!f) { st.innerHTML = '<div class="empty">Không có khung.</div>'; return; }
  const v = f.views[angleOf(f)];
  if (S.mode === 'sbs') {
    st.innerHTML = `<div class="pane"><span class="tag truoc">TRƯỚC · v1</span>${img(v.truoc)}</div><div class="pane"><span class="tag sau">SAU · v2</span>${img(v.sau)}</div>`;
  } else if (S.mode === 'wipe') {
    const t = S.zoom > 1 ? `transform:scale(${S.zoom});transform-origin:${S.ox}% ${S.oy}%` : '';
    st.innerHTML = `<div class="pane" id="wp"><span class="tag truoc">TRƯỚC</span><span class="tag sau r">SAU</span>
      <div class="wipe" style="${t}"><img src="${url(v.truoc)}" draggable="false"><img class="top" src="${url(v.sau)}" style="clip-path:inset(0 0 0 ${S.wipe}%)" draggable="false"><div class="line" style="left:${S.wipe}%"></div></div></div>`;
  } else {
    const b = S.flip;
    st.innerHTML = `<div class="pane"><span class="tag ${b ? 'truoc' : 'sau'}" style="font-size:16px">${b ? 'TRƯỚC · v1' : 'SAU · v2'}</span>${img(b ? v.truoc : v.sau)}</div>`;
  }
  preload(it);
}

function preload(it) {
  for (const d of [-1, 1]) {
    const f = frames(it)[S.frame + d];
    const v = f && f.views[angleOf(f)];
    if (v) for (const p of [v.truoc, v.sau]) new Image().src = url(p);
  }
  const f = frames(it)[S.frame];
  if (f) for (const v of Object.values(f.views)) for (const p of [v.truoc, v.sau]) new Image().src = url(p);
}

function renderRight() {
  const it = S.items[S.cur];
  const c = rec(it);
  const f = frames(it)[S.frame];
  let head;
  if (it.kind === 'shot') {
    const k = sec(it);
    head = `<div><h2>#${it.n} ${esc(it.scene)}</h2>
      <div class="meta"><b>${esc(it.cast)}</b> · tay <b>${it.side}</b> · ${esc(it.role)}</div>
      <div class="meta"><code>${esc(it.old)}</code> → <code>${esc(it.item)}@${esc(it.group)}</code></div>
      <div class="meta">lệch <b>${it.angle}°</b> / <b>${it.shift}</b> đơn vị</div></div>
      <div class="lab">${esc(it.label)}</div>
      <div class="note n-${k}">${md(it.note)}</div>`;
  } else head = `<div><h2>${esc(it.title)}</h2><div class="meta">${it.kind === 'video' ? 'Video' : 'Tờ ghép'} nhóm <b>${esc(it.group)}</b> · ${(it.kind === 'video' ? it.videos.map((v) => v.src) : [it.src]).map((p) => `<code>${esc(p)}</code>`).join(' ')}</div></div>
      ${it.hint.length ? `<div class="note n-it">${it.hint.map(md).join('<br>')}</div>` : '<div class="note">Không có ghi chú bố cục — đọc theo nhãn trên ảnh.</div>'}
      ${it.note ? `<div class="note">${md(it.note)}</div>` : ''}`;
  const others = it.kind === 'shot' ? Object.entries(c.frames).filter(([k, v]) => v && (!f || k !== fkey(f))) : [];
  $('#right').innerHTML = `${head}
    <div class="box"><h3>Quyết định</h3><div id="status">${STATUS.map(([k, l]) => `<button data-st="${k}" class="${k} ${c.status === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    ${f ? `<div class="box"><h3>Nhận xét khung ${f.t} s</h3><textarea id="tf" rows="4" placeholder="Chỗ sai thấy ở giây này…">${esc(c.frames[fkey(f)] || '')}</textarea>
      ${others.length ? `<div id="others">${others.map(([k, v]) => `<div><b data-goto="${esc(k)}">${esc(k)}</b>: ${esc(v)}</div>`).join('')}</div>` : ''}</div>` : ''}
    <div class="box"><h3>Nhận xét chung</h3><textarea id="tr" rows="5" placeholder="Nhận xét cho cả dòng…">${esc(c.text)}</textarea></div>
    <div id="saved"></div>`;
  $('#tf')?.addEventListener('input', (e) => { c.frames[fkey(f)] = e.target.value; save(); markFrame(); });
  $('#tr').addEventListener('input', (e) => { c.text = e.target.value; save(); });
  showSaved();
}

function markFrame() {
  const it = S.items[S.cur];
  const f = frames(it)[S.frame];
  $(`#frames [data-fr="${S.frame}"]`)?.classList.toggle('has', !!S.db[it.id]?.frames?.[fkey(f)]);
}

/** Video của mục đang xem: chạy, dừng, tua, tốc độ đồng bộ theo video vừa đổi */
const vids = () => [...document.querySelectorAll('#stage video')];
let syncing = false;
function hookVideos(it) {
  const fps = it.fps ?? 30;
  const show = (v) => { const el = $('#vtime'); if (el) el.textContent = `${v.currentTime.toFixed(2).replace('.', ',')} s · khung ${Math.round(v.currentTime * fps)}`; };
  for (const v of vids()) {
    v.defaultPlaybackRate = v.playbackRate = S.speed;
    v.addEventListener('loadedmetadata', () => { v.playbackRate = S.speed; });
    v.addEventListener('ratechange', () => {
      if (v.playbackRate === S.speed) return;
      S.speed = v.playbackRate;
      for (const o of vids()) o.playbackRate = S.speed;
      renderBar();
    });
    v.addEventListener('timeupdate', () => show(v));
    v.addEventListener('seeked', () => show(v));
    for (const ev of ['play', 'pause', 'seeked']) v.addEventListener(ev, () => {
      if (syncing) return;
      syncing = true;
      for (const o of vids()) if (o !== v) {
        if (ev === 'play') { o.currentTime = v.currentTime; o.play(); }
        else if (ev === 'pause') { o.pause(); o.currentTime = v.currentTime; }
        else if (Math.abs(o.currentTime - v.currentTime) > 0.5 / fps) o.currentTime = v.currentTime;
      }
      setTimeout(() => { syncing = false; }, 0);
    });
  }
}
function vplay() { const vs = vids(); if (!vs.length) return; const go = vs[0].paused; for (const v of vs) go ? v.play() : v.pause(); }
function vstep(d) {
  const it = S.items[S.cur];
  const vs = vids();
  if (!vs.length) return;
  const fps = it.fps ?? 30;
  const f = Math.max(0, Math.round(vs[0].currentTime * fps) + d);
  for (const v of vs) { v.pause(); v.currentTime = Math.min(v.duration || Infinity, (f + 0.5) / fps); }
}
function vspeed(r) { S.speed = r; for (const v of vids()) v.defaultPlaybackRate = v.playbackRate = r; renderBar(); }

function render() { renderList(); renderBar(); renderStage(); renderRight(); location.hash = S.items[S.cur].id; }

let timer, state = 'Đã nạp nhận xét.';
function save() {
  localStorage.setItem(LS, JSON.stringify(S.db));
  clearTimeout(timer);
  state = 'Đang lưu…'; showSaved();
  timer = setTimeout(async () => {
    try {
      const r = await fetch('/api/nhan-xet', { method: 'POST', body: JSON.stringify(S.db) });
      if (!r.ok) throw 0;
      state = `Đã lưu vào duyet-web/nhan-xet.md lúc ${new Date().toLocaleTimeString('vi')}`;
    } catch { state = '!Không lưu được vào file — nhận xét vẫn giữ trong trình duyệt.'; }
    showSaved(); renderList();
  }, 400);
}
function showSaved() { const el = $('#saved'); if (!el) return; el.textContent = state.replace(/^!/, ''); el.className = state[0] === '!' ? 'err' : ''; }

function go(i) { S.cur = (i + S.items.length) % S.items.length; S.frame = 0; S.flip = false; render(); }
function step(d) {
  const ord = order().filter((it) => visible(it) || it === S.items[S.cur]);
  const k = ord.indexOf(S.items[S.cur]);
  const nx = ord[k + d];
  if (nx) go(S.items.indexOf(nx));
}
function setFrame(i) {
  const n = frames(S.items[S.cur]).length;
  if (!n) return;
  S.frame = Math.max(0, Math.min(n - 1, i));
  renderBar(); renderStage(); renderRight();
}
function setStatus(k) {
  const c = rec(S.items[S.cur]);
  c.status = c.status === k ? '' : k;
  save(); renderList(); renderRight();
}
function cycleAngle() {
  const f = frames(S.items[S.cur])[S.frame];
  if (!f) return;
  const ks = ANGLES.map((a) => a[0]).filter((k) => f.views[k]);
  S.angle = ks[(ks.indexOf(angleOf(f)) + 1) % ks.length];
  renderBar(); renderStage();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-i],[data-f],[data-mode],[data-angle],[data-zoom],[data-fr],[data-st],[data-goto],[data-v],[data-speed],.sheet img');
  if (!t) return;
  const d = t.dataset;
  if (d.i) go(+d.i);
  else if (d.f) { S.filter = d.f; renderList(); }
  else if (d.mode) { S.mode = d.mode; renderBar(); renderStage(); }
  else if (d.angle) { S.angle = d.angle; renderBar(); renderStage(); }
  else if (d.zoom) { S.zoom = +d.zoom; renderBar(); renderStage(); }
  else if (d.fr) setFrame(+d.fr);
  else if (d.v) d.v === 'play' ? vplay() : vstep(+d.v);
  else if (d.speed) vspeed(+d.speed);
  else if (d.st) setStatus(d.st);
  else if (d.goto) {
    const it = S.items[S.cur];
    let i = frames(it).findIndex((f) => fkey(f) === d.goto);
    if (i < 0) { S.extra = true; i = frames(it).findIndex((f) => fkey(f) === d.goto); }
    setFrame(i);
  } else t.parentElement.classList.toggle('big');
});

$('#extra').addEventListener('change', (e) => {
  const it = S.items[S.cur];
  const f = frames(it)[S.frame];
  S.extra = e.target.checked;
  S.frame = Math.max(0, frames(it).indexOf(f));
  renderBar(); renderStage(); renderRight();
});
$('#auto').addEventListener('change', (e) => {
  clearInterval(S.auto);
  if (e.target.checked) { S.mode = 'blink'; renderBar(); S.auto = setInterval(() => { S.flip = !S.flip; renderStage(); }, 700); }
});

const stage = $('#stage');
stage.addEventListener('mousemove', (e) => {
  const p = e.target.closest('.pane');
  if (!p) return;
  const r = (p.querySelector('.wipe') || p.querySelector('img'))?.getBoundingClientRect();
  if (!r) return;
  if (S.mode === 'wipe' && (e.buttons & 1 || S.zoom === 1)) {
    S.wipe = Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));
    const w = p.querySelector('.wipe');
    w.querySelector('.top').style.clipPath = `inset(0 0 0 ${S.wipe}%)`;
    w.querySelector('.line').style.left = S.wipe + '%';
    return;
  }
  if (S.zoom === 1) return;
  const pr = p.getBoundingClientRect();
  S.ox = Math.max(0, Math.min(100, ((e.clientX - pr.left) / pr.width) * 100));
  S.oy = Math.max(0, Math.min(100, ((e.clientY - pr.top) / pr.height) * 100));
  for (const el of stage.querySelectorAll('.pane > img, .wipe')) el.style.transformOrigin = `${S.ox}% ${S.oy}%`;
});
stage.addEventListener('mousedown', () => { if (S.mode === 'blink' && !S.auto) { S.flip = true; renderStage(); } });
document.addEventListener('mouseup', () => { if (S.mode === 'blink' && S.flip && !S.auto) { S.flip = false; renderStage(); } });

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  const video = S.items[S.cur].kind === 'video';
  if (video && (k === 'ArrowRight' || k === 'l' || k === '.')) vstep(1);
  else if (video && (k === 'ArrowLeft' || k === 'h' || k === ',')) vstep(-1);
  else if (video && k === ' ') vplay();
  else if (video && k === 's') vspeed(SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]);
  else if (k === 'j' || k === 'ArrowDown') step(1);
  else if (k === 'k' || k === 'ArrowUp') step(-1);
  else if (k === 'ArrowRight' || k === 'l') setFrame(S.frame + 1);
  else if (k === 'ArrowLeft' || k === 'h') setFrame(S.frame - 1);
  else if (k === 'a') cycleAngle();
  else if ('123'.includes(k) && S.items[S.cur].kind === 'shot') { S.mode = MODES[+k - 1][0]; renderBar(); renderStage(); }
  else if (k === 'z') { S.zoom = ZOOMS[(ZOOMS.indexOf(S.zoom) + 1) % ZOOMS.length]; renderBar(); renderStage(); }
  else if (k === ' ') { if (S.mode !== 'blink') { S.mode = 'blink'; renderBar(); } if (!S.flip) { S.flip = true; renderStage(); } }
  else if (k === 'd') setStatus('ok');
  else if (k === 'x') setStatus('sua');
  else if (k === 'q') setStatus('hoi');
  else if (k === 'c') { ($('#tf') || $('#tr')).focus(); }
  else if (k === 'C') $('#tr').focus();
  else return;
  e.preventDefault();
});
document.addEventListener('keyup', (e) => {
  if (e.key === ' ' && S.items[S.cur].kind !== 'video' && S.flip && !S.auto && e.target.tagName !== 'TEXTAREA') { S.flip = false; renderStage(); }
});

(async () => {
  S.items = await (await fetch('/duyet-web/data.json')).json();
  let server = {};
  try { const r = await fetch('/api/nhan-xet'); if (r.ok) server = await r.json(); } catch {}
  const local = JSON.parse(localStorage.getItem(LS) || '{}');
  S.db = Object.keys(server).length ? server : local;
  if (!Object.keys(server).length && Object.keys(local).length) save();
  const h = location.hash.slice(1);
  const i = S.items.findIndex((it) => it.id === h);
  S.cur = i >= 0 ? i : S.items.indexOf(order()[0]);
  render();
})();
</script>
</body>
</html>
