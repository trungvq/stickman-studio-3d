  <title id="title">Cụm vàng bạc châu báu</title>
  <desc id="desc">Cụm đạo cụ độc lập, nền trong suốt: vàng, bạc, tiền vàng, vương miện, chuỗi ngọc trai, kim cương và đá quý. Mỗi món nằm trong một nhóm treasure riêng; không chứa ảnh hay liên kết ngoài.</desc>
