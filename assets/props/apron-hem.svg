<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
  <title id="title">Tạp dề chủ quán (mảnh hem, ảnh mực)</title>
  <desc id="desc">Mảnh hem hai màu: nét đen, ruột trắng, màu thật ở pieces.hem.color. Yếm ngực ở mép trên, dây quàng cổ thò lên mép trên, dây lưng buộc nơ bên phải, thân tạp dề xoè tới gấu, túi đựng bút. Nhãn tên đen bệt.</desc>
